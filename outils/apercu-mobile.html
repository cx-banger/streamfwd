<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muzikly-aperçu mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  Outil de travail : affiche Muzikly dans plusieurs cadres de téléphone, côte à côte.
  Ouvre ce fichier dans ton navigateur (double-clic).
  - « En ligne » : le site publié (https://cx-banger.github.io/streamfwd/)
  - « Local »    : ta version en cours de développement (lance d'abord « npm run dev »)
-->
<style>
  :root { --scale: 0.82; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1f1d1b;
    color: #fff;
    font-family: 'Figtree', system-ui, sans-serif;
    padding: 28px 24px 40px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; }
  header p { margin: 0; color: rgba(255,255,255,.6); font-weight: 500; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
  .controls .sep { width: 1px; height: 26px; background: rgba(255,255,255,.15); margin: 0 4px; }
  .controls button {
    font: inherit; font-weight: 700; color: #fff; cursor: pointer;
    background: #3b3937; border: none; border-radius: 8px; padding: 8px 14px;
    box-shadow: 0 3px 0 #22201e;
  }
  .controls button.on { background: #e74b3b; box-shadow: 0 3px 0 #9c2f23; }
  .hint { width: 100%; margin: -8px 0 18px; font-size: 14px; color: #f7c631; }
  .hint[hidden] { display: none; }
  .phones { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { font-weight: 800; font-size: 15px; color: rgba(255,255,255,.85); }
  .phone {
    width: calc(390px * var(--scale) + 24px);
    height: calc(844px * var(--scale) + 24px);
    padding: 12px;
    background: #0c0c0c;
    border-radius: 48px;
    box-shadow: 0 0 0 2px #3a3a3a, 0 24px 60px rgba(0,0,0,.5);
    position: relative;
  }
  .phone::before {
    content: ''; position: absolute; z-index: 2; top: 20px; left: 50%;
    width: 96px; height: 26px; transform: translateX(-50%);
    background: #0c0c0c; border-radius: 20px;
  }
  /* Écran d'iPhone (390 × 844) : barre d’état 44 px + app 790 px + barre d’accueil 10 px,
     le tout mis à l'échelle ensemble pour que rien ne déborde du cadre */
  .screen {
    width: calc(390px * var(--scale));
    height: calc(844px * var(--scale));
    overflow: hidden;
    border-radius: 38px;
    background: #000;
  }
  .device { width: 390px; height: 844px; transform: scale(var(--scale)); transform-origin: 0 0; display: flex; flex-direction: column; background: #000; }
  .status {
    height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px 0 38px; background: #000; font-weight: 800; font-size: 16px;
  }
  .status span:last-child { letter-spacing: 2px; font-size: 13px; }
  iframe { width: 390px; height: 790px; flex-shrink: 0; border: 0; background: #000; display: block; }
  .home-bar { height: 10px; flex-shrink: 0; display: flex; align-items: flex-start; justify-content: center; background: #212121; }
  .home-bar::after { content: ''; width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); }
</style>
</head>
<body>
  <header>
    <h1>Muzikly — aperçu mobile</h1>
    <p>Les écrans sont interactifs : clique, fais défiler, lance un son.</p>
    <div class="controls">
      <button data-src="online" class="on">En ligne</button>
      <button data-src="local">Local</button>
      <span class="sep"></span>
      <button data-s="0.65">Petit</button>
      <button data-s="0.82" class="on">Moyen</button>
      <button data-s="1">Taille réelle</button>
      <span class="sep"></span>
      <button id="reload">Recharger</button>
    </div>
    <p class="hint" id="localHint" hidden>Mode local : lance d’abord <code>npm run dev</code> dans le dossier du projet, sinon les écrans resteront vides.</p>
  </header>

  <div class="phones" id="phones"></div>

<script>
  const SOURCES = {
    online: 'https://cx-banger.github.io/streamfwd/',
    local: 'http://localhost:5173/streamfwd/'
  };
  const SCREENS = [
    ['#/home', 'Accueil'],
    ['#/search', 'Explorer'],
    ['#/artist/1', 'Page artiste'],
    ['#/track/3/8', 'Titre + mini-lecteur (touche-le)'],
    ['#/liked', 'Sons likés'],
    ['#/videos', 'Vidéos'],
    ['#/upcoming', 'Événements'],
    ['#/event/nan-live', 'Fiche événement'],
    ['#/upload', 'Espace artiste']
  ];

  let source = localStorage.getItem('apercu-source') || 'online';

  function render() {
    const base = SOURCES[source];
    document.getElementById('phones').innerHTML = SCREENS.map(([hash, label]) => `
      <figure>
        <div class="phone"><div class="screen"><div class="device">
          <div class="status"><span>9:41</span><span>●●● ▮</span></div>
          <iframe src="${base}${hash}" title="${label}" loading="lazy"></iframe>
          <div class="home-bar"></div>
        </div></div></div>
        <figcaption>${label}</figcaption>
      </figure>`).join('');
    document.querySelectorAll('[data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === source));
    document.getElementById('localHint').hidden = source !== 'local';
  }

  document.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => {
    source = b.dataset.src;
    localStorage.setItem('apercu-source', source);
    render();
  }));
  document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
    document.documentElement.style.setProperty('--scale', b.dataset.s);
    document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
  }));
  document.getElementById('reload').addEventListener('click', () =>
    document.querySelectorAll('iframe').forEach(f => { f.src = f.src; }));

  render();
</script>
</body>
</html>
